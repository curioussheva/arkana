name: Build Dev Client (Android)

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'app.json'
      - 'eas.json'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-dev.yaml'

jobs:
  build-dev:
    name: EAS Build (development profile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Type check
        run: pnpm type-check

      - name: Lint
        run: pnpm lint

      - name: Build dev client on EAS
        run: eas build --platform android --profile development --non-interactive --no-wait
